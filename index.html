<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CONSOLA DEVA // Protocolo J.A. Leaks</title>
    <style>
        :root {
            --neon-green: #00ff88;
            --neon-green-dim: #004422;
            --bg-dark: #050505;
            --matrix-green: rgba(0, 255, 136, 0.15);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-dark);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            padding: 16px;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Scanline CRT Effect */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.04));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        #terminal {
            flex-grow: 1;
            overflow-y: auto;
            font-size: 13.5px;
            line-height: 1.55;
            scrollbar-width: none;
            z-index: 1;
            padding-bottom: 20px;
        }

        #terminal::-webkit-scrollbar { display: none; }

        .line { margin-bottom: 8px; word-break: break-word; }
        .prompt { color: var(--neon-green); font-weight: bold; }
        .system { color: #94a3b8; font-style: italic; }
        .deva { color: #38bdf8; text-shadow: 0 0 6px rgba(56, 189, 248, 0.4); }
        .error { color: #f87171; }
        .success { color: #00ff88; text-shadow: 0 0 6px rgba(0, 255, 136, 0.4); }

        .input-area {
            display: flex;
            align-items: center;
            border-top: 1px solid var(--neon-green-dim);
            padding: 12px 0;
            background: var(--bg-dark);
            z-index: 3;
            flex-shrink: 0;
        }

        #user-input {
            background: transparent;
            border: none;
            color: var(--neon-green);
            outline: none;
            width: 100%;
            font-size: 15px;
            font-family: inherit;
            padding-left: 10px;
        }

        .btn-action { 
            display: inline-block; margin: 6px 8px 6px 0; padding: 6px 12px; 
            border: 1px solid var(--neon-green); color: var(--neon-green); 
            text-decoration: none; font-weight: bold; font-size: 0.72rem; 
            transition: all 0.2s; background: transparent; border-radius: 4px;
        }
        .btn-action:hover { background: var(--neon-green); color: #000; cursor: pointer; transform: scale(1.02); }

        @media (max-width: 600px) {
            #terminal { font-size: 12px; }
            #user-input { font-size: 14px; }
            body { padding: 10px; }
        }
    </style>
</head>
<body>

    <div id="terminal">
        <!-- ANIMACIÓN DE ARRANQUE ASCII -->
        <pre id="boot-anim" style="color: var(--neon-green); font-size: 9px; line-height: 1.1; margin-bottom: 15px; overflow-x: hidden;"></pre>
        
        <div id="output"></div>
    </div>
    
    <div class="input-area">
        <span class="prompt">> Tiresias@DEVA:</span>
        <input type="text" id="user-input" autofocus autocomplete="off" spellcheck="false" placeholder="Introduce comando, clave o habla con DEVA...">
    </div>
    
    <!-- Módulos de la Terminal -->
    <script src="database.js"></script>
    <script src="efectos.js"></script>
    <script src="test.js"></script>
</body>
</html>
